[project]
name = "missingpiece-backend"
version = "0.1.0"
description = "MissingPiece API (FastAPI + PostgreSQL)"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi (>=0.115)",
    "uvicorn[standard] (>=0.30)",
    "sqlalchemy (>=2.0.36)",
    "alembic (>=1.14)",
    "psycopg[binary] (>=3.2.10)",
    "pydantic-settings (>=2.6)",
    "pyjwt[crypto] (>=2.10)",
    "httpx (>=0.28)",
    "python-multipart (>=0.0.20)",
    "groq (>=0.13)",
    "email-validator (>=2.2)",
    "supabase (>=2.34.1,<3.0.0)",
]

[tool.poetry]
# The back end is an app, not a library (build prompt 4.1).
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3"
ruff = ">=0.8"
bandit = "^1.9.4"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Generated by Alembic autogenerate: long enum lists are fine there.
"alembic/versions/*" = ["E501"]
# Inline HTML for the mock payment page.
"app/routers/payments.py" = ["E501"]
# Demo sentences in the seed data.
"app/seed.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
